# Quick fix: quando rogaciano.svg ou rogaciano.css mudar, atualize o cache-buster abaixo para forcar recarga no Home Assistant.
image: /local/floorplan/rogaciano.svg?v=20260328b
stylesheet: /local/floorplan/rogaciano.css?v=20260328b
console_log_level: warn
log_level: warn
defaults:
  hover_action: hover-info
functions: |
  > return {
      roomHelpers: {
        rua: 'input_boolean.ambiente_rua',
        escada: 'input_boolean.ambiente_escada',
        garagem: 'input_boolean.ambiente_garagem',
        piscina: 'input_boolean.ambiente_piscina',
        varanda: 'input_boolean.ambiente_varanda',
        sala: 'input_boolean.ambiente_sala',
        quarto_caru: 'input_boolean.ambiente_quarto_caru',
        quarto_marcos: 'input_boolean.ambiente_quarto_marcos',
        quarto_vroou: 'input_boolean.ambiente_quarto_vroou',
        quarto_mamae: 'input_boolean.ambiente_quarto_mamae',
        cozinha: 'input_boolean.ambiente_cozinha',
        banheiro_social: 'input_boolean.ambiente_banheiro_social',
        area: 'input_boolean.ambiente_area',
        lavanderia: 'input_boolean.ambiente_lavanderia',
        banheiro_mamae: 'input_boolean.ambiente_banheiro_mamae',
        terraco: 'input_boolean.ambiente_terraco'
      },
      areaLights: {
        garagem: ['switch.garagem_interruptor_1'],
        escada: ['input_select.floorplan_estado_lampada_escada'],
        piscina: ['switch.pisicina1_interruptor_1', 'switch.piscina2_interruptor_1', 'switch.pisicina3_interruptor_1', 'switch.pisicina4_interruptor_1'],
        terraco: ['switch.terraco1_interruptor_1', 'light.terraco2_interruptor_1', 'switch.terraco3_interruptor_1'],
        quarto_vroou: ['light.ventilador_do_vroou']
      },
      areaAlerts: {
        garagem: ['binary_sensor.garagem_movimento'],
        piscina: ['input_boolean.alerta_camera_varanda_pessoa'],
        varanda: ['input_boolean.alerta_camera_varanda_pessoa'],
        rua: ['input_boolean.alerta_camera_rua_deteccao']
      },
      getState: (hass, entityId) => {
        const entity = hass && hass.states ? hass.states[entityId] : undefined;
        return String(entity && entity.state != null ? entity.state : '').toLowerCase();
      },
      isUnavailableState: (state) => ['unavailable', 'unknown', 'offline', 'none', ''].includes(String(state || '').toLowerCase()),
      isOnState: (state, entityId = '') => {
        const normalized = String(state || '').toLowerCase();
        if (['unavailable', 'unknown', 'offline', 'none', ''].includes(normalized)) return false;
        const domain = String(entityId || '').split('.')[0];
        if (domain === 'input_select') return normalized !== 'off';
        return ['on', 'playing', 'paused', 'idle', 'cool', 'heat', 'fan_only', 'dry', 'auto', 'streaming', 'recording'].includes(normalized);
      },
      deviceStateClass: (entity) => {
        if (!entity) return 'device-unavailable';
        const state = String(entity && entity.state != null ? entity.state : '').toLowerCase();
        const entityId = String(entity && entity.entity_id != null ? entity.entity_id : '').toLowerCase();
        const domain = entityId.split('.')[0];

        if (['unavailable', 'unknown', 'offline', 'none'].includes(state)) return 'device-unavailable';
        if (domain === 'camera') return state === 'off' ? 'device-off' : 'device-on';
        if (domain === 'media_player') return ['off', 'standby'].includes(state) ? 'device-off' : 'device-on';
        if (domain === 'climate') return state === 'off' ? 'device-off' : 'device-on';
        if (domain === 'input_select') {
          if (state === 'unavailable') return 'device-unavailable';
          if (state === 'off') return 'device-off';
          return 'device-on';
        }
        if (['on', 'playing', 'paused', 'idle', 'cool', 'heat', 'fan_only', 'dry', 'auto', 'streaming', 'recording'].includes(state)) return 'device-on';
        if (['off', 'standby'].includes(state)) return 'device-off';
        return 'device-off';
      },
      areaStateClass: (areaId, hass) => {
        const helperId = areaId && functions.roomHelpers ? functions.roomHelpers[areaId] : undefined;
        const helperState = helperId ? functions.getState(hass, helperId) : '';
        const hasAlert = ((functions.areaAlerts && functions.areaAlerts[areaId]) || []).some((entityId) => functions.getState(hass, entityId) === 'on');
        if (hasAlert) return 'room-alert-on';
        const hasLightOn = ((functions.areaLights && functions.areaLights[areaId]) || []).some((entityId) => functions.isOnState(functions.getState(hass, entityId), entityId));
        if (hasLightOn) return 'room-light-on';
        if (functions.isUnavailableState(helperState)) return 'room-unavailable';
        return helperState === 'on' ? 'room-helper-on' : 'room-helper-off';
      },
      glareStateClass: (entity) => {
        if (!entity) return '';
        const state = String(entity && entity.state != null ? entity.state : '').toLowerCase();
        const entityId = String(entity && entity.entity_id != null ? entity.entity_id : '').toLowerCase();
        return functions.isOnState(state, entityId) ? 'glare-on' : '';
      },
      motionStateClass: (entity) => {
        if (!entity) return '';
        const state = String(entity && entity.state != null ? entity.state : '').toLowerCase();
        return state === 'on' ? 'motion-on' : '';
      }
    };
